name: Website checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:database
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- vendor/
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TRACK_DASHBOARD_SCREENSHOTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: /tmp/track-*-validation/*.png
          if-no-files-found: ignore
